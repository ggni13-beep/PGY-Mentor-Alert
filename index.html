<script>

/* ============================================================
   PGY Mentor Alert
   EXCEL DIRECT READ VERSION

   GitHub:
   /data/PGY_Master.xlsx

   Excel = 唯一資料來源

   00_INDEX
       ↓
   RT001_姓名
   RT002_姓名
   RT003_姓名
   ...

   網站只負責：
   1. 讀取 Excel
   2. 顯示資料
   3. 計算 PGY Month
   4. 顯示 Learning Journey
   5. 顯示完成率
   ============================================================ */


/* ------------------------------------------------------------
   全域資料
   ------------------------------------------------------------ */

let workbook = null;

let people = [];

let excelJourney = {};

let selected = "";

let view = "overview";


/* ------------------------------------------------------------
   Excel 路徑
   ------------------------------------------------------------ */

const EXCEL_URL =
  "./data/PGY_Master.xlsx?v=" + Date.now();


/* ------------------------------------------------------------
   日期
   ------------------------------------------------------------ */

function dateOnly(value){

  if(!value) return null;

  if(value instanceof Date){
    return new Date(
      value.getFullYear(),
      value.getMonth(),
      value.getDate()
    );
  }

  const s = String(value).trim();

  if(!s) return null;

  const d = new Date(s);

  if(!isNaN(d.getTime())){

    return new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    );

  }

  return null;
}


/* ------------------------------------------------------------
   日期格式
   ------------------------------------------------------------ */

function formatDate(value){

  const d = dateOnly(value);

  if(!d) return "";

  return d.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  );
}


/* ------------------------------------------------------------
   PGY Month
   ------------------------------------------------------------ */

function pgyMonth(start){

  const a = dateOnly(start);

  if(!a) return 0;

  const b = new Date();

  let m =
    (b.getFullYear() - a.getFullYear()) * 12
    +
    (b.getMonth() - a.getMonth())
    +
    1;

  return Math.max(
    1,
    Math.min(24,m)
  );
}


/* ------------------------------------------------------------
   M01 日期
   ------------------------------------------------------------ */

function monthDate(start,m){

  const d = dateOnly(start);

  if(!d) return null;

  const x = new Date(d);

  x.setMonth(
    x.getMonth() + m - 1
  );

  return x;
}


/* ------------------------------------------------------------
   Excel 狀態判斷
   ------------------------------------------------------------ */

function isDoneValue(v){

  const s =
    String(v ?? "")
      .trim()
      .toLowerCase();

  return [
    "☑",
    "✓",
    "✔",
    "完成",
    "done",
    "true",
    "1",
    "yes"
  ].includes(s);
}


/* ------------------------------------------------------------
   計畫時間判斷
   ------------------------------------------------------------ */

function planned(plan,m){

  if(!plan) return false;

  const t =
    String(plan)
      .trim()
      .replaceAll("–","-")
      .replaceAll("—","-");

  /* 每月 */
  if(
    t.includes("每月") ||
    t.toLowerCase()==="monthly"
  ){
    return true;
  }

  /* 每3個月 */
  if(
    t.includes("每3個月") ||
    t.includes("每3月") ||
    t.toLowerCase()==="quarter"
  ){
    return m % 3 === 0;
  }

  /* 每2–3個月 */
  if(
    t.includes("每2") ||
    t.includes("2-3") ||
    t.toLowerCase()==="recurring-2-3"
  ){
    return [
      3,6,9,12,15,18,21,24
    ].includes(m);
  }

  /* CCC */
  if(
    t.includes("CCC") ||
    t.toLowerCase()==="ccc"
  ){
    return [
      3,6,12,18,24
    ].includes(m);
  }

  /* M01–03 / 1-3 */
  const match =
    t.match(/(\d+)\s*-\s*(\d+)/);

  if(match){

    const a = Number(match[1]);
    const b = Number(match[2]);

    return m >= a && m <= b;
  }

  /* M24 */
  const single =
    t.match(/(\d+)/);

  if(single){

    return m === Number(single[1]);
  }

  return false;
}


/* ------------------------------------------------------------
   Excel 儲存格 → 狀態
   ------------------------------------------------------------ */

function cellDone(value){

  return isDoneValue(value);
}


/* ------------------------------------------------------------
   解析 PGY INDEX
   ------------------------------------------------------------ */

function parseIndexSheet(ws){

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:""
      }
    );

  const result = [];

  for(let i=0;i<rows.length;i++){

    const r = rows[i];

    if(!r || !r.length) continue;

    if(
      String(r[0]).trim()==="PGY編號"
    ){
      continue;
    }

    const id =
      String(r[0] ?? "").trim();

    const name =
      String(r[1] ?? "").trim();

    const start =
      r[2];

    const sheet =
      String(r[3] ?? "").trim();

    const purpose =
      String(r[4] ?? "").trim();

    const status =
      String(r[5] ?? "").trim();

    if(
      /^RT\d+$/i.test(id)
      &&
      name
    ){

      result.push({
        id,
        name,
        start,
        sheet,
        purpose,
        status
      });

    }

  }

  return result;
}


/* ------------------------------------------------------------
   解析個人 PGY 工作表
   ------------------------------------------------------------ */

function parsePersonSheet(ws){

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:""
      }
    );

  if(!rows.length) return null;


  /* ----------------------------------------------------------
     找第4列：
     學習／評核項目
     ---------------------------------------------------------- */

  let headerRow = -1;

  for(let i=0;i<rows.length;i++){

    const first =
      String(rows[i][0] ?? "").trim();

    if(
      first==="學習／評核項目"
    ){
      headerRow=i;
      break;
    }

  }

  if(headerRow<0){
    return null;
  }


  const header =
    rows[headerRow];


  /* ----------------------------------------------------------
     找 M01-M24
     ---------------------------------------------------------- */

  const monthCols = {};

  for(let c=0;c<header.length;c++){

    const h =
      String(header[c] ?? "")
        .trim()
        .toUpperCase();

    const m =
      h.match(/^M(\d{1,2})$/);

    if(m){

      const n =
        Number(m[1]);

      if(n>=1 && n<=24){

        monthCols[n]=c;

      }

    }

  }


  /* ----------------------------------------------------------
     找 PGY 編號 / 姓名 / 到職日
     ---------------------------------------------------------- */

  let id="";
  let name="";
  let start="";
  let end="";
  let currentMonth="";


  for(let i=0;i<Math.min(5,rows.length);i++){

    const r=rows[i];

    for(let c=0;c<r.length;c++){

      const key =
        String(r[c] ?? "").trim();

      const value =
        r[c+1];

      if(key==="PGY編號"){
        id=String(value ?? "").trim();
      }

      if(key==="學員姓名"){
        name=String(value ?? "").trim();
      }

      if(key==="到職日"){
        start=value;
      }

      if(key==="預計結訓日"){
        end=value;
      }

      if(key==="目前PGY Month"){
        currentMonth=value;
      }

    }

  }


  /* ----------------------------------------------------------
     讀取 Learning Journey
     ---------------------------------------------------------- */

  const tasks=[];


  for(
    let r=headerRow+2;
    r<rows.length;
    r++
  ){

    const row=rows[r];

    if(!row) continue;

    const item =
      String(row[0] ?? "").trim();

    const category =
      String(row[1] ?? "").trim();

    const plan =
      String(row[2] ?? "").trim();

    if(!item) continue;

    if(
      item==="TODAY" ||
      item.startsWith("操作：")
    ){
      continue;
    }

    const months={};

    for(let m=1;m<=24;m++){

      const col =
        monthCols[m];

      months[m] =
        col===undefined
          ? ""
          : row[col];

    }

    tasks.push({
      item,
      category,
      plan,
      months
    });

  }


  return {
    id,
    name,
    start,
    end,
    currentMonth,
    tasks
  };

}


/* ------------------------------------------------------------
   讀取 Excel
   ------------------------------------------------------------ */

async function loadExcel(){

  try{

    const response =
      await fetch(
        EXCEL_URL,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "PGY_Master.xlsx 無法讀取，HTTP " +
        response.status
      );

    }

    const buffer =
      await response.arrayBuffer();


    workbook =
      XLSX.read(
        buffer,
        {
          type:"array",
          cellDates:true
        }
      );


    /* --------------------------------------------------------
       00_INDEX
       -------------------------------------------------------- */

    const indexName =
      workbook.SheetNames.find(
        s =>
          s==="00_INDEX" ||
          s.toUpperCase().includes("INDEX")
      );


    if(!indexName){

      throw new Error(
        "Excel 找不到 00_INDEX 工作表"
      );

    }


    people =
      parseIndexSheet(
        workbook.Sheets[indexName]
      );


    /* --------------------------------------------------------
       讀取所有 PGY 分頁
       -------------------------------------------------------- */

    excelJourney={};


    people.forEach(p=>{

      let sheetName =
        p.sheet;

      if(
        !sheetName ||
        !workbook.Sheets[sheetName]
      ){

        /* 如果 INDEX 沒有寫分頁名稱，
           嘗試找 RT001 開頭的工作表 */

        sheetName =
          workbook.SheetNames.find(
            s =>
              s.startsWith(
                p.id+"_"
              )
          );

      }


      if(
        sheetName &&
        workbook.Sheets[sheetName]
      ){

        const data =
          parsePersonSheet(
            workbook.Sheets[sheetName]
          );

        if(data){

          excelJourney[p.id]=data;

        }

      }

    });


    /* --------------------------------------------------------
       預設選擇第一位 PGY
       -------------------------------------------------------- */

    if(
      !selected ||
      !people.some(
        p=>p.id===selected
      )
    ){

      selected =
        people[0]?.id || "";

    }


    render();


  }catch(error){

    console.error(
      "Excel loading error:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML=`

      <div class="error">

        <b>⚠️ Excel 讀取失敗</b>

        <br><br>

        ${error.message}

        <br><br>

        請確認 GitHub 是否存在：

        <br>

        <b>
        /data/PGY_Master.xlsx
        </b>

      </div>

    `;

  }

}


/* ------------------------------------------------------------
   取得目前 PGY
   ------------------------------------------------------------ */

function person(){

  return people.find(
    p=>p.id===selected
  ) || people[0];

}


/* ------------------------------------------------------------
   取得目前 PGY 工作表
   ------------------------------------------------------------ */

function personData(){

  const p=person();

  if(!p) return null;

  return excelJourney[p.id] || null;

}


/* ------------------------------------------------------------
   判斷完成
   ------------------------------------------------------------ */

function isTaskDone(
  p,
  task,
  m
){

  if(!p || !task) return false;

  const value =
    task.months?.[m];

  return cellDone(value);

}


/* ------------------------------------------------------------
   計算完成率
   ------------------------------------------------------------ */

function summary(p){

  const data =
    excelJourney[p.id];

  if(!data){

    return {
      n:0,
      c:0,
      rate:0,
      m:pgyMonth(p.start)
    };

  }


  let total=0;
  let completed=0;


  data.tasks.forEach(task=>{

    for(
      let m=1;
      m<=24;
      m++
    ){

      if(
        planned(
          task.plan,
          m
        )
      ){

        total++;

        if(
          isTaskDone(
            p,
            task,
            m
          )
        ){

          completed++;

        }

      }

    }

  });


  return {
    n:total,
    c:completed,
    rate:
      total
        ? Math.round(
            completed/total*100
          )
        :0,
    m:pgyMonth(p.start)
  };

}


/* ------------------------------------------------------------
   狀態 Badge
   ------------------------------------------------------------ */

function badge(s){

  if(s.rate>=90){

    return `
      <span class="badge g">
        🟢 正常
      </span>
    `;

  }

  if(s.rate>=70){

    return `
      <span class="badge y">
        🟡 追蹤
      </span>
    `;

  }

  return `
    <span class="badge o">
      🟠 需處理
    </span>
  `;

}


/* ------------------------------------------------------------
   PGY 選單
   ------------------------------------------------------------ */

function sel(){

  return `

    <select
      onchange="selectPerson(this.value)"
    >

      ${people.map(p=>`

        <option
          value="${p.id}"
          ${p.id===selected?"selected":""}
        >

          ${p.id}｜${p.name}

        </option>

      `).join("")}

    </select>

  `;

}


/* ------------------------------------------------------------
   計畫主任總覽
   ------------------------------------------------------------ */

function overview(){

  const rows =
    people.map(p=>{

      const s =
        summary(p);

      const phase =
        s.m<=3
          ? "Training Course"
          : s.m<=12
            ? "PGY Core"
            : "Advanced PGY";


      return `

        <tr>

          <td>
            <b>${p.id}</b>
            ｜${p.name}
          </td>

          <td>
            M${String(s.m).padStart(2,"0")}
          </td>

          <td>
            ${phase}
          </td>

          <td>

            <div
              style="
                display:flex;
                gap:8px;
                align-items:center
              "
            >

              <div
                class="bar"
                style="width:100px"
              >

                <span
                  style="
                    width:${s.rate}%
                  "
                ></span>

              </div>

              ${s.rate}%

            </div>

          </td>

          <td>
            ${badge(s)}
          </td>

          <td>

            <button
              class="btn"
              onclick="selectPerson('${p.id}')"
            >
              查看
            </button>

          </td>

        </tr>

      `;

    }).join("");


  const total =
    people.reduce(
      (a,p)=>
        a+summary(p).n,
      0
    );


  const done =
    people.reduce(
      (a,p)=>
        a+summary(p).c,
      0
    );


  const overall =
    total
      ? Math.round(
          done/total*100
        )
      :0;

/* ------------------------------------------------------------
   Mentor Alert
   ------------------------------------------------------------ */

function mentor(){

  const p=person();

  if(!p){

    return `
      <div class="card">
        尚無學員資料。
      </div>
    `;

  }


  const data =
    personData();

  const s =
    summary(p);

  const m=s.m;


  if(!data){

    return `
      <div class="card">
        找不到 ${p.id} 的 Excel 工作表。
      </div>
    `;

  }


  const list =
    data.tasks
      .filter(
        task =>
          planned(
            task.plan,
            m
          )
      )
      .map(task=>{

        const done =
          isTaskDone(
            p,
            task,
            m
          );


        return `

          <div class="task">

            <div>

              <b>
                ${task.item}
              </b>

              <small>

                ${task.category}
                ｜M${String(m).padStart(2,"0")}
                ｜${formatDate(
                  monthDate(
                    p.start,
                    m
                  )
                )}

              </small>

            </div>


            <span
              class="badge ${done?"g":"y"}"
            >

              ${done
                ? "☑ 已完成"
                : "☐ 待完成"}

            </span>

          </div>

        `;

      })
      .join("");


  return `

    <div class="top">

      <div>

        <h1>
          Mentor Alert
        </h1>

        <div class="sub">
          導師本期工作清單｜資料來自 GitHub Excel
        </div>

      </div>

      ${sel()}

    </div>


    <div class="notice">

      <b>
        ${p.id}｜${p.name}
      </b>

      ｜到職日 ${formatDate(p.start)}

      ｜目前
      <b>
        M${String(m).padStart(2,"0")}
      </b>

    </div>


    <div class="card">

      <h2>
        🔔 本期應完成
      </h2>

      ${
        list ||
        "<p>目前沒有對應任務。</p>"
      }

    </div>

  `;

}


/* ------------------------------------------------------------
   Learning Journey
   ------------------------------------------------------------ */

function journey(){

  const p=person();

  if(!p){

    return `
      <div class="card">
        尚無學員資料。
      </div>
    `;

  }


  const data =
    personData();


  if(!data){

    return `
      <div class="card">
        找不到 ${p.id} 的 Learning Journey。
      </div>
    `;

  }


  const m =
    pgyMonth(p.start);


  /* ----------------------------------------------------------
     表頭
     ---------------------------------------------------------- */

  const heads = `

    <div class="jh">

      <div>
        學習／評核項目
      </div>

      <div>
        類別
      </div>

      <div>
        計畫時間
      </div>

      ${Array.from(
        {length:24},
        (_,i)=>`

          <div>
            M${String(i+1).padStart(2,"0")}
          </div>

        `
      ).join("")}

      <div>
        完成率
      </div>

    </div>

  `;


  /* ----------------------------------------------------------
     每一列
     ---------------------------------------------------------- */

  const rows =
    data.tasks.map(task=>{

      let total=0;
      let completed=0;


      let html = `

        <div class="jr">

          <div>
            <b>
              ${task.item}
            </b>
          </div>

          <div>
            ${task.category}
          </div>

          <div>
            ${task.plan}
          </div>

      `;


      for(
        let mm=1;
        mm<=24;
        mm++
      ){

        const pl =
          planned(
            task.plan,
            mm
          );


        const done =
          isTaskDone(
            p,
            task,
            mm
          );


        if(pl){

          total++;

          if(done){
            completed++;
          }

        }


        let classes =
          "mc ";


        if(pl){

          classes +=
            done
              ? "done "
              : "planned ";

        }else{

          classes +=
            "not-planned ";

        }


        if(mm===m){

          classes +=
            "today ";

        }


        let symbol="";


        /*
         * 重要：
         * 一律使用方框
         * 不使用圓形
         */

        if(done){

          symbol =
            `<span class="check">☑</span>`;

        }else if(pl){

          symbol =
            `<span class="check">☐</span>`;

        }


        html += `

          <div
            class="${classes}"
            title="${
              pl
                ? done
                  ? "已完成"
                  : "應完成"
                : ""
            }"
          >

            ${symbol}

          </div>

        `;

      }


      const rate =
        total
          ? Math.round(
              completed/total*100
            )
          :0;


      html += `

          <div>

            <b>
              ${rate}%
            </b>

          </div>

        </div>

      `;


      return html;

    }).join("");


  return `

    <div class="top">

      <div>

        <h1>
          Learning Journey
        </h1>

        <div class="sub">
          24M 工程進度表｜紅框＝目前PGY月份
        </div>

      </div>

      ${sel()}

    </div>


    <div class="notice">

      <b>
        ${p.id}｜${p.name}
      </b>

      ｜到職日
      ${formatDate(p.start)}

      ｜目前
      <b>
        M${String(m).padStart(2,"0")}
      </b>

    </div>


    <div class="journey">

      ${heads}

      ${rows}

    </div>

  `;

}

/* ------------------------------------------------------------
   選擇 PGY
   ------------------------------------------------------------ */

function selectPerson(id){

  selected=id;

  if(view==="overview"){

    view="individual";

  }

  render();

}


/* ------------------------------------------------------------
   Render
   ------------------------------------------------------------ */

function render(){

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "active",
          b.dataset.view===view
        )
    );


  const app =
    document.getElementById(
      "app"
    );


  if(!people.length){

    app.innerHTML=`

      <div class="card">

        尚未讀取到 PGY 資料。

      </div>

    `;

    return;

  }


  if(view==="overview"){

    app.innerHTML=
      overview();

  }

  else if(view==="mentor"){

    app.innerHTML=
      mentor();

  }

  else if(view==="journey"){

    app.innerHTML=
      journey();

  }

  else{

    app.innerHTML=
      individual();

  }

}


/* ------------------------------------------------------------
   左側選單
   ------------------------------------------------------------ */

document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    button => {

      button.onclick=()=>{

        view =
          button.dataset.view;

        render();

      };

    }
  );


/* ------------------------------------------------------------
   啟動
   ------------------------------------------------------------ */

loadExcel();
