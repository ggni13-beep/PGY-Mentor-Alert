<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGY Mentor Alert</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --navy:#17365d;
  --navy2:#1f4e79;
  --bg:#f5f7fa;
  --line:#dbe2ea;
  --green:#2e7d32;
  --greenbg:#e8f5e9;
  --yellow:#fff2cc;
  --orange:#f4a261;
  --red:#c62828;
  --today:#d0392b;
  --text:#263238;
  --muted:#667085;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    "Segoe UI",
    Arial,
    "Noto Sans TC",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

.app{
  display:flex;
  min-height:100vh;
}

/* =========================
   左側選單
========================= */

.sidebar{
  width:235px;
  flex:0 0 235px;
  background:var(--navy);
  color:#fff;
  min-height:100vh;
  padding:20px 14px;
  position:sticky;
  top:0;
  align-self:flex-start;
}

.brand{
  padding:0 10px 18px;
}

.brand-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:.2px;
}

.brand-sub{
  font-size:12px;
  font-weight:600;
  opacity:.8;
  margin-top:5px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  width:100%;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#fff;
  padding:12px 13px;
  text-align:left;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.nav button:hover{
  background:rgba(255,255,255,.08);
}

.nav button.active{
  background:rgba(255,255,255,.14);
}

/* =========================
   主畫面
========================= */

.main{
  flex:1;
  min-width:0;
  padding:26px;
}

.page-title{
  margin:0;
  color:var(--navy);
  font-size:32px;
  font-weight:800;
}

.page-sub{
  margin-top:5px;
  color:var(--muted);
  font-size:15px;
}

.alert{
  margin:0 0 18px;
  padding:15px 18px;
  border-radius:12px;
  border:1px solid #f5c2c0;
  background:#fff1f0;
  color:#b42318;
}

.alert strong{
  display:block;
  margin-bottom:5px;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin:20px 0;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(20,40,70,.04);
}

.card-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.card-value{
  color:var(--navy);
  font-size:28px;
  font-weight:800;
}

.table-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(20,40,70,.04);
}

.table-scroll{
  width:100%;
  overflow:auto;
}

table{
  border-collapse:collapse;
  width:100%;
}

th{
  background:#f8fafc;
  color:#344054;
  font-size:13px;
  font-weight:800;
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  padding:10px;
  border-bottom:1px solid #edf0f4;
  font-size:13px;
}

tr:last-child td{
  border-bottom:0;
}

.btn{
  border:1px solid #cbd5e1;
  background:#fff;
  color:var(--navy);
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{
  background:#f1f5f9;
}

/* =========================
   Badge
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.badge.green{
  background:var(--greenbg);
  color:var(--green);
}

.badge.yellow{
  background:#fff8dc;
  color:#946200;
}

.badge.orange{
  background:#fff0e6;
  color:#b54708;
}

/* =========================
   Learning Journey
========================= */

.journey-header{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin:20px 0 14px;
}

.journey-info{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.info-box{
  background:#f8fafc;
  border-radius:10px;
  padding:10px 12px;
}

.info-label{
  font-size:12px;
  color:var(--muted);
}

.info-value{
  margin-top:4px;
  font-size:16px;
  font-weight:800;
  color:var(--navy);
}

.journey-wrap{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:auto;
  box-shadow:0 2px 8px rgba(20,40,70,.04);
}

.journey-table{
  border-collapse:collapse;
  table-layout:fixed;
  min-width:1650px;
}

.journey-table th,
.journey-table td{
  border:1px solid #cfd7e3;
  padding:4px 5px;
  height:30px;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
}

.journey-table th{
  background:#17365d;
  color:#fff;
  font-size:12px;
}

.journey-table td{
  font-size:12px;
  background:#fff;
}

.journey-table td.item{
  text-align:left;
  white-space:normal;
  font-weight:600;
}

.journey-table td.category{
  text-align:left;
  white-space:nowrap;
}

.journey-table td.plan{
  text-align:center;
  white-space:nowrap;
}

.journey-table .planned{
  background:var(--yellow);
}

.journey-table .completed{
  background:var(--greenbg);
}

.journey-table .planned.completed{
  background:#dff0df;
}

.checkbox{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:22px;
  border:1px solid #9aa5b1;
  border-radius:3px;
  background:#fff;
  font-size:16px;
  line-height:1;
  font-weight:700;
}

.checkbox.done{
  border-color:#4b7f52;
  background:#e8f5e9;
  color:#2e7d32;
}

.date-row td{
  background:#f8fafc !important;
  color:#667085;
  font-size:10px;
}

.today-row td{
  position:relative;
}

.today-marker{
  color:var(--today);
  font-size:15px;
  font-weight:900;
}

/* =========================
   PGY 個人頁
========================= */

.selector{
  display:flex;
  gap:10px;
  align-items:center;
  margin:20px 0;
  flex-wrap:wrap;
}

.selector select{
  min-width:250px;
  padding:9px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  font-size:14px;
}

.back-btn{
  padding:9px 13px;
}

/* =========================
   Footer
========================= */

.footer{
  margin-top:18px;
  color:#667085;
  font-size:12px;
}

/* =========================
   Mobile
========================= */

@media(max-width:900px){

  .sidebar{
    width:78px;
    flex-basis:78px;
    padding:15px 8px;
  }

  .brand{
    padding:0 5px 15px;
  }

  .brand-title{
    font-size:14px;
    line-height:1.2;
  }

  .brand-sub{
    display:none;
  }

  .nav button{
    font-size:0;
    text-align:center;
    padding:12px 5px;
  }

  .nav button::first-letter{
    font-size:18px;
  }

  .main{
    padding:18px 14px;
  }

  .page-title{
    font-size:28px;
  }

  .card-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .journey-info{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px){

  .card-grid{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:14px;
  }

  .card-value{
    font-size:24px;
  }

  .journey-info{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       Sidebar
  ========================== -->

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-title">PGY Mentor Alert</div>
      <div class="brand-sub">24M Learning Journey</div>
    </div>

    <nav class="nav">

      <button
        class="active"
        data-view="overview">
        📊 計畫主任總覽
      </button>

      <button
        data-view="mentor">
        🧑‍🏫 Mentor Alert
      </button>

      <button
        data-view="journey">
        🗓️ Learning Journey
      </button>

      <button
        data-view="personal">
        👤 個人PGY
      </button>

    </nav>

  </aside>


  <!-- =========================
       Main
  ========================== -->

  <main class="main">

    <div id="appContent">
      <div class="card">
        Excel 載入中……
      </div>
    </div>

  </main>

</div>


<script>

/* ============================================================
   PGY Mentor Alert
   Excel Direct Read Version

   唯一資料來源：

   /data/PGY_Master.xlsx

   不再使用：
   assessment.csv
   learning_journey.csv
   mentor_alert.csv
   pgy_master.csv

   ============================================================ */


/* ============================================================
   基本設定
============================================================ */

const EXCEL_PATH = "data/PGY_Master.xlsx";

let workbook = null;

let people = [];

let selectedPGY = "";

let currentView = "overview";

let excelError = null;


/* ============================================================
   工具
============================================================ */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function sheetNames(){

  if(!workbook){
    return [];
  }

  return workbook.SheetNames || [];
}


function getSheet(name){

  if(!workbook){
    return null;
  }

  return workbook.Sheets[name] || null;
}


/* ============================================================
   Excel 日期
============================================================ */

function excelDateToDate(value){

  if(value instanceof Date){
    return value;
  }

  if(typeof value === "number"){

    try{

      const parsed =
        XLSX.SSF.parse_date_code(value);

      if(parsed){

        return new Date(
          parsed.y,
          parsed.m - 1,
          parsed.d
        );
      }

    }catch(e){}

  }

  if(typeof value === "string"){

    const d = new Date(value);

    if(!isNaN(d.getTime())){
      return d;
    }

  }

  return null;
}


function formatDate(value){

  const d = excelDateToDate(value);

  if(!d){
    return "";
  }

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}/${m}/${day}`;
}


/* ============================================================
   計算 PGY Month
============================================================ */

function pgyMonth(startValue){

  const start = excelDateToDate(startValue);

  if(!start){
    return 0;
  }

  const today = new Date();

  let months =
    (today.getFullYear() - start.getFullYear()) * 12
    +
    (today.getMonth() - start.getMonth());

  if(today.getDate() < start.getDate()){
    months--;
  }

  months++;

  if(months < 1){
    months = 1;
  }

  if(months > 24){
    months = 24;
  }

  return months;
}


/* ============================================================
   讀取 00_INDEX
============================================================ */

function loadPeopleFromIndex(){

  const names = sheetNames();

  const indexSheet =
    getSheet("00_INDEX") ||
    getSheet(names[0]);

  if(!indexSheet){
    return [];
  }

  const rows =
    XLSX.utils.sheet_to_json(
      indexSheet,
      {
        header:1,
        defval:""
      }
    );

  const result = [];

  for(let i=0;i<rows.length;i++){

    const row = rows[i];

    if(!row){
      continue;
    }

    const id =
      String(row[1] || "").trim();

    const name =
      String(row[2] || "").trim();

    const sheet =
      String(row[4] || "").trim();

    const purpose =
      String(row[5] || "").trim();

    const status =
      String(row[6] || "").trim();

    if(
      /^RT\d+$/i.test(id)
      &&
      name
      &&
      sheet
    ){

      result.push({
        id,
        name,
        sheet,
        purpose,
        status
      });

    }

  }

  return result;
}


/* ============================================================
   從個人工作表讀取基本資料
============================================================ */

function readPersonSheet(person){

  const ws =
    getSheet(person.sheet);

  if(!ws){
    return {
      ...person,
      start:"",
      end:"",
      month:0
    };
  }

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:"",
        raw:true
      }
    );

  let start = "";
  let end = "";
  let month = 0;
  let name = person.name;
  let id = person.id;

  /*
    Excel 第 2 列：

    A = PGY編號
    B = RT001
    D = 學員姓名
    E = 林書暄
    G = 到職日
    H = 日期
    J = 預計結訓日
    K = 日期
    M = 目前PGY Month
    N = 數字
  */

  if(rows[1]){

    id =
      String(rows[1][1] || id).trim();

    name =
      String(rows[1][4] || name).trim();

    start =
      rows[1][7] || "";

    end =
      rows[1][10] || "";

    month =
      Number(rows[1][13] || 0);

  }

  if(!month){
    month = pgyMonth(start);
  }

  return {
    ...person,
    id,
    name,
    start,
    end,
    month
  };
}


/* ============================================================
   初始化人物
============================================================ */

function buildPeople(){

  people =
    loadPeopleFromIndex()
      .map(readPersonSheet);

  if(
    !selectedPGY
    ||
    !people.some(p=>p.id===selectedPGY)
  ){

    selectedPGY =
      people.length
      ?
      people[0].id
      :
      "";
  }
}


/* ============================================================
   找目前人物
============================================================ */

function currentPerson(){

  return (
    people.find(
      p=>p.id===selectedPGY
    )
    ||
    people[0]
    ||
    null
  );
}


/* ============================================================
   讀取 Learning Journey
============================================================ */

function readJourney(person){

  if(!person){
    return null;
  }

  const ws =
    getSheet(person.sheet);

  if(!ws){
    return null;
  }

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:"",
        raw:true
      }
    );

  return rows;
}


/* ============================================================
   判斷是不是 Checkbox
============================================================ */

function isCheckbox(value){

  const s =
    String(value || "").trim();

  return (
    s === "☐"
    ||
    s === "☑"
    ||
    s === "✓"
    ||
    s === "✔"
    ||
    s === "○"
    ||
    s === "●"
    ||
    s === "X"
    ||
    s === "x"
  );
}


function isDone(value){

  const s =
    String(value || "").trim();

  return (
    s === "☑"
    ||
    s === "✓"
    ||
    s === "✔"
    ||
    s.toLowerCase() === "x"
  );
}


/* ============================================================
   產生 Checkbox HTML

   注意：
   一律使用方框。
   不使用圓形 checkbox。
============================================================ */

function checkboxHTML(value){

  if(!isCheckbox(value)){
    return escapeHTML(value);
  }

  if(isDone(value)){

    return `
      <span class="checkbox done">✓</span>
    `;

  }

  return `
    <span class="checkbox">☐</span>
  `;
}


/* ============================================================
   Excel 欄位寬度

   優先讀取 workbook 的 !cols。
   若 Excel 沒有提供，使用固定的
   A / B / C / M01~M24 / 完成率配置。
============================================================ */

function getColumnWidth(ws,colIndex){

  try{

    if(
      ws
      &&
      ws["!cols"]
      &&
      ws["!cols"][colIndex]
      &&
      ws["!cols"][colIndex].wch
    ){

      return ws["!cols"][colIndex].wch;
    }

  }catch(e){}

  /*
    A：學習／評核項目
    B：類別
    C：計畫時間
    D:AA：M01~M24
    AB：完成率
  */

  if(colIndex === 0){
    return 270;
  }

  if(colIndex === 1){
    return 95;
  }

  if(colIndex === 2){
    return 100;
  }

  if(colIndex >= 3 && colIndex <= 26){
    return 52;
  }

  if(colIndex === 27){
    return 75;
  }

  return 70;
}


/* ============================================================
   Journey Table
============================================================ */

function journeyHTML(person){

  const rows =
    readJourney(person);

  if(!rows){

    return `
      <div class="alert">
        <strong>⚠️ 找不到個人工作表</strong>
        ${escapeHTML(person ? person.sheet : "")}
      </div>
    `;
  }

  /*
    Excel：
    第 4 列 index 3：
    學習／評核項目
    類別
    計畫時間
    M01 ... M24
    完成率

    第 5 列 index 4：
    對應日期
  */

  const header =
    rows[3] || [];

  const dateRow =
    rows[4] || [];

  let html = `
    <div class="journey-wrap">
    <table class="journey-table">
      <colgroup>
  `;

  for(let c=0;c<28;c++){

    const width =
      getColumnWidth(
        getSheet(person.sheet),
        c
      );

    html += `
      <col style="width:${width}px">
    `;
  }

  html += `
      </colgroup>
      <thead>
        <tr>
  `;

  for(let c=0;c<28;c++){

    let text =
      header[c] || "";

    if(c === 0){
      text = "學習／評核項目";
    }

    html += `
      <th>${escapeHTML(text)}</th>
    `;
  }

  html += `
        </tr>
      </thead>
      <tbody>
  `;


  /* =========================
     對應日期
  ========================== */

  html += `
    <tr class="date-row">
  `;

  for(let c=0;c<28;c++){

    let value =
      dateRow[c] || "";

    if(c >= 3 && c <= 26){
      value = formatDate(value);
    }

    html += `
      <td>${escapeHTML(value)}</td>
    `;
  }

  html += `
    </tr>
  `;


  /* =========================
     資料列
  ========================== */

  for(let r=5;r<rows.length;r++){

    const row =
      rows[r] || [];

    /*
      TODAY 行特殊處理
    */

    const first =
      String(row[0] || "").trim();

    if(first === "TODAY"){

      html += `
        <tr class="today-row">
      `;

      for(let c=0;c<28;c++){

        const value =
          String(row[c] || "").trim();

        if(
          value === "●"
          ||
          value === "○"
        ){

          html += `
            <td>
              <span class="today-marker">●</span>
            </td>
          `;

        }else{

          html += `<td>${escapeHTML(value)}</td>`;

        }

      }

      html += `
        </tr>
      `;

      continue;
    }


    /*
      操作說明列
    */

    if(
      first.startsWith("操作：")
    ){

      html += `
        <tr>
          <td colspan="28"
              style="text-align:left;padding:12px;background:#f8fafc;">
            ${escapeHTML(first)}
          </td>
        </tr>
      `;

      continue;
    }


    /*
      一般資料列
    */

    if(!first){

      continue;
    }

    html += `
      <tr>
    `;


    for(let c=0;c<28;c++){

      const value =
        row[c] === undefined
        ?
        ""
        :
        row[c];

      let classes = [];

      if(c === 0){
        classes.push("item");
      }

      if(c === 1){
        classes.push("category");
      }

      if(c === 2){
        classes.push("plan");
      }

      /*
        D～AA = M01～M24
      */

      if(c >= 3 && c <= 26){

        if(
          isCheckbox(value)
          ||
          String(value || "").trim() !== ""
        ){

          classes.push("planned");

        }

        if(isDone(value)){
          classes.push("completed");
        }

      }

      html += `
        <td class="${classes.join(" ")}">
      `;

      if(
        c >= 3
        &&
        c <= 26
        &&
        isCheckbox(value)
      ){

        html += checkboxHTML(value);

      }else{

        html += escapeHTML(value);

      }

      html += `
        </td>
      `;

    }


    html += `
      </tr>
    `;

  }


  html += `
      </tbody>
    </table>
    </div>
  `;

  return html;
}


/* ============================================================
   計算完成率

   只計算 M01～M24 中實際存在 checkbox 的項目。
============================================================ */

function calculateCompletion(person){

  const rows =
    readJourney(person);

  if(!rows){
    return {
      total:0,
      done:0,
      rate:0
    };
  }

  let total = 0;
  let done = 0;

  for(let r=5;r<rows.length;r++){

    const row =
      rows[r] || [];

    const item =
      String(row[0] || "").trim();

    if(
      !item
      ||
      item === "TODAY"
      ||
      item.startsWith("操作：")
    ){
      continue;
    }

    for(let c=3;c<=26;c++){

      const value =
        row[c];

      if(isCheckbox(value)){

        total++;

        if(isDone(value)){
          done++;
        }

      }

    }

  }

  return {
    total,
    done,
    rate:
      total
      ?
      Math.round(done / total * 100)
      :
      0
  };
}


/* ============================================================
   Status
============================================================ */

function statusBadge(rate){

  if(rate >= 90){

    return `
      <span class="badge green">
        🟢 正常
      </span>
    `;

  }

  if(rate >= 70){

    return `
      <span class="badge yellow">
        🟡 追蹤
      </span>
    `;

  }

  return `
    <span class="badge orange">
      🟠 需處理
    </span>
  `;
}


/* ============================================================
   Overview
============================================================ */

function overviewPage(){

  let total = 0;
  let done = 0;

  people.forEach(p=>{

    const s =
      calculateCompletion(p);

    total += s.total;
    done += s.done;

  });

  const overallRate =
    total
    ?
    Math.round(done / total * 100)
    :
    0;


  let rows = "";

  people.forEach(p=>{

    const s =
      calculateCompletion(p);

    const m =
      p.month || pgyMonth(p.start);

    let stage = "";

    if(m <= 3){
      stage = "Training Course";
    }else if(m <= 12){
      stage = "PGY Core";
    }else{
      stage = "Advanced PGY";

          ｜${escapeHTML(p.name)}
        </td>

          M${String(m).padStart(2,"0")}
        </td>

        <td>
          ${escapeHTML(stage)}
        </td>

        <td>
          ${s.rate}%
        </td>

        <td>
          ${statusBadge(s.rate)}
        </td>

        <td>
          <button
            class="btn"
            onclick="openPerson('${escapeHTML(p.id)}')">
            查看
          </button>

      </tr>

  return `

    <div class="card-grid">

        </div>

      </div>


      <div class="card">

        </div>

        <div class="card-value">

/* ============================================================
   Render
============================================================ */

function render(){

  const content =
    document.getElementById("appContent");

  if(!content){
    return;
  }

  if(excelError){

    content.innerHTML = `

      <div class="alert">

        <strong>
          ⚠️ Excel 讀取失敗
        </strong>

        <div>
          ${escapeHTML(excelError)}
        </div>

        <br>

        <div>
          請確認 GitHub 是否存在：
        </div>

        <strong>
          /data/PGY_Master.xlsx
        </strong>

      </div>

    `;

    return;
  }


  if(!workbook){

    content.innerHTML = `
      <div class="card">
        Excel 載入中……
      </div>
    `;

    return;

  }


  if(currentView === "overview"){

    content.innerHTML =
      overviewPage();

  }
  else if(currentView === "mentor"){

    content.innerHTML =
      mentorPage();

  }
  else if(currentView === "journey"){

    content.innerHTML =
      journeyPage();

  }
  else if(currentView === "personal"){

    content.innerHTML =
      personalPage();

  }

}


/* ============================================================
   Navigation
============================================================ */

function setView(view){

  currentView = view;

  document
    .querySelectorAll(".nav button")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.view === view
      );

    });

  render();

}


function showOverview(){

  setView("overview");

}


function showJourney(){

  setView("journey");

}


function openPerson(id){

  selectedPGY = id;

  setView("journey");

}


function selectPerson(id){

  selectedPGY = id;

  render();

}


/* ============================================================
   左側選單
============================================================ */

document
  .querySelectorAll(".nav button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        setView(
          button.dataset.view
        );

      }
    );

  });


/* ============================================================
   讀取 Excel
============================================================ */

async function loadExcel(){

  try{

    render();

    /*
      使用相對路徑：

      GitHub Pages：
      https://ggni13-beep.github.io/PGY-Mentor-Alert/

      實際讀取：
      /PGY-Mentor-Alert/data/PGY_Master.xlsx

      不使用 raw.githubusercontent.com，
      避免 GitHub Pages 路徑問題。
    */

    const response =
      await fetch(
        EXCEL_PATH,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const buffer =
      await response.arrayBuffer();


    workbook =
      XLSX.read(
        buffer,
        {
          type:"array",
          cellDates:true,
          cellStyles:true
        }
      );


    if(
      !workbook
      ||
      !workbook.SheetNames
      ||
      workbook.SheetNames.length === 0
    ){

      throw new Error(
        "Excel 中沒有工作表"
      );

    }


    buildPeople();


    if(people.length === 0){

      throw new Error(
        "00_INDEX 找不到 RT001、RT002 等 PGY 資料"
      );

    }


    render();


  }catch(error){

    console.error(
      "Excel loading failed:",
      error
    );

    workbook = null;

    excelError =
      `PGY_Master.xlsx 無法讀取：${error.message}`;

    render();

  }

}


/* ============================================================
   啟動
============================================================ */

loadExcel();
