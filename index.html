<div class="app">

<script>

/* ==========================================================
   PGY Mentor Alert
   ORIGINAL UI + GitHub CSV DATA LAYER

   UI：固定
   Data：GitHub /data/*.csv

   CSV：
   /data/pgy_master.csv
   /data/learning_journey.csv
   /data/assessment.csv
   /data/mentor_alert.csv
   ========================================================== */


/* ----------------------------------------------------------
   DATA
---------------------------------------------------------- */

let people = [];
let csvJourney = [];
let csvAssessment = [];
let csvAlerts = [];

let selected = "";
let view = "overview";


/* ----------------------------------------------------------
   DATA PATH
---------------------------------------------------------- */

const DATA_BASE = "./data/";


/* ----------------------------------------------------------
   CSV LOADER
---------------------------------------------------------- */

async function loadCSV(fileName){

  const response = await fetch(
    DATA_BASE + fileName + "?v=" + Date.now(),
    {
      cache:"no-store"
    }
  );

  if(!response.ok){
    throw new Error(
      fileName + " HTTP " + response.status
    );
  }

  return parseCSV(
    await response.text()
  );
}


/* ----------------------------------------------------------
   CSV PARSER

   支援：
   - 中文
   - UTF-8 BOM
   - quoted comma
   - Windows CRLF
---------------------------------------------------------- */

function parseCSV(text){

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;

  for(let i=0;i<text.length;i++){

    const ch = text[i];
    const next = text[i+1];

    if(ch === '"'){

      if(quoted && next === '"'){
        field += '"';
        i++;
      }else{
        quoted = !quoted;
      }

    }else if(ch === ',' && !quoted){

      row.push(field);
      field = "";

    }else if(
      (ch === '\n' || ch === '\r') &&
      !quoted
    ){

      if(ch === '\r' && next === '\n'){
        i++;
      }

      row.push(field);
      field = "";

      if(
        row.some(
          value => String(value).trim() !== ""
        )
      ){
        rows.push(row);
      }

      row = [];

    }else{

      field += ch;

    }
  }

  if(field !== "" || row.length){

    row.push(field);
    rows.push(row);

  }

  if(!rows.length){
    return [];
  }

  const headers =
    rows[0].map(
      value =>
        String(value)
          .trim()
          .replace(/^\uFEFF/,"")
    );

  return rows.slice(1).map(row => {

    const object = {};

    headers.forEach((header,index)=>{

      object[header] =
        row[index] === undefined
          ? ""
          : String(row[index]).trim();

    });

    return object;

  });
}


/* ----------------------------------------------------------
   SAFE VALUE
---------------------------------------------------------- */

function value(row,...keys){

  for(const key of keys){

    if(
      row &&
      row[key] !== undefined &&
      row[key] !== null &&
      String(row[key]).trim() !== ""
    ){
      return String(row[key]).trim();
    }

  }

  return "";
}


/* ----------------------------------------------------------
   STATUS

   避免畫面出現：
   TRUE / FALSE
   1 / 0
---------------------------------------------------------- */

function csvStatus(v){

  const s =
    String(v ?? "")
      .trim()
      .toLowerCase();

  return [
    "true",
    "1",
    "yes",
    "y",
    "done",
    "complete",
    "completed",
    "完成",
    "已完成",
    "✓",
    "☑"
  ].includes(s);
}


/* ----------------------------------------------------------
   DATE
---------------------------------------------------------- */

function dateOnly(value){

  if(!value){
    return null;
  }

  const text =
    String(value)
      .replace(/\//g,"-")
      .slice(0,10);

  const date =
    new Date(text + "T00:00:00");

  return isNaN(date.getTime())
    ? null
    : date;
}


/* ----------------------------------------------------------
   PGY MONTH

   優先使用 CSV 的 PGY_Month
   沒有才依到職日計算
---------------------------------------------------------- */

function pgyMonth(person){

  const csvMonth =
    Number(person.csvMonth);

  if(
    Number.isFinite(csvMonth) &&
    csvMonth >= 1 &&
    csvMonth <= 24
  ){
    return csvMonth;
  }

  const start =
    dateOnly(person.start);

  if(!start){
    return 1;
  }

  const now = new Date();

  const months =
    (now.getFullYear() - start.getFullYear()) * 12 +
    (now.getMonth() - start.getMonth()) +
    1;

  return Math.max(
    1,
    Math.min(24,months)
  );
}


/* ----------------------------------------------------------
   MONTH DATE
---------------------------------------------------------- */

function monthDate(start,month){

  const d =
    dateOnly(start);

  if(!d){
    return new Date();
  }

  d.setMonth(
    d.getMonth() + month - 1
  );

  return d;
}


/* ----------------------------------------------------------
   DATE FORMAT
---------------------------------------------------------- */

function md(date){

  if(!(date instanceof Date)){
    return "";
  }

  return date.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  );
}


/* ----------------------------------------------------------
   ORIGINAL LEARNING JOURNEY TASKS

   UI / 24M STRUCTURE 保留
---------------------------------------------------------- */

const tasks = [

  ["基礎課程","基本氧氣治療與濕氣噴霧治療","1-3"],
  ["基礎課程","低血氧／高二氧化碳／ABG","1-3"],
  ["基礎課程","Auto-PEEP及處置","1-3"],
  ["基礎課程","身體評估","1-3"],
  ["基礎課程","呼吸照護登入系統（VPN）","1-3"],

  ["技術評核","0–3個月技術考","1-3"],

  ["專業課程","臨床成人呼吸生理學","4-12"],
  ["專業課程","胸腔常見疾病介紹","4-12"],
  ["專業課程","小兒氣道照護","4-12"],
  ["專業課程","呼吸器分類／操作／脫離（含ATC）","4-12"],
  ["專業課程","健保相關事宜","4-12"],

  ["技術評核","4–12個月技術評核","4-12"],

  ["專業課程","手術前後呼吸照護","13-24"],
  ["專業課程","COPD呼吸照護","13-24"],
  ["專業課程","ARDS呼吸照護","13-24"],
  ["專業課程","VAP呼吸照護","13-24"],
  ["專業課程","呼吸功能改善","13-24"],
  ["專業課程","HFOV臨床應用","13-24"],
  ["專業課程","iNO臨床應用","13-24"],
  ["專業課程","Prone Position Ventilation","13-24"],
  ["專業課程","Lung Recruitment Management","13-24"],

  ["技術評核","13–24個月技術評核","13-24"],

  ["EPA","Ad-hoc EPA","recurring-2-3"],
  ["評核","Mini-CEX","quarter"],
  ["評核","CBD／PBD","quarter"],
  ["評核","IPD／360°","quarter"],
  ["CCC","CCC能力進度檢視","ccc"],
  ["導師","每月導師面談","monthly"],
  ["Exit","結訓前能力盤點","22-24"],
  ["Exit","Final Assessment／結訓確認","24-24"]

];


/* ----------------------------------------------------------
   PLANNED
---------------------------------------------------------- */

function planned(type,month){

  if(type === "monthly"){
    return true;
  }

  if(type === "quarter"){
    return month % 3 === 0;
  }

  if(type === "ccc"){
    return [3,6,12,18,24].includes(month);
  }

  if(type === "recurring-2-3"){
    return [3,6,9,12,15,18,21,24].includes(month);
  }

  if(type.includes("-")){

    const parts =
      type.split("-").map(Number);

    if(parts.length === 2){

      const a = parts[0];
      const b = parts[1];

      return month >= a && month <= b;

    }

  }

  return false;
}


/* ----------------------------------------------------------
   FIND PERSON
---------------------------------------------------------- */

function person(){

  return people.find(
    p => p.id === selected
  ) || people[0];

}


/* ----------------------------------------------------------
   JOURNEY CSV STATUS

   支援多種欄位名稱
---------------------------------------------------------- */

function journeyRow(personId,item,month){

  return csvJourney.find(row => {

    const id =
      value(
        row,
        "Trainee_ID",
        "PGY_ID",
        "ID"
      );

    const name =
      value(
        row,
        "Item",
        "項目",
        "Task",
        "Learning_Item",
        "學習／評核項目"
      );

    const m =
      value(
        row,
        "Month",
        "PGY_Month",
        "M"
      );

    return (
      id === String(personId) &&
      name === String(item) &&
      Number(m) === Number(month)
    );

  });

}


/* ----------------------------------------------------------
   DONE
---------------------------------------------------------- */

function isDone(personId,item,month){

  const row =
    journeyRow(
      personId,
      item,
      month
    );

  if(!row){
    return false;
  }

  const status =
    value(
      row,
      "Status",
      "完成",
      "Completed",
      "Done",
      "Result"
    );

  return csvStatus(status);
}


/* ----------------------------------------------------------
   LOCAL TEMP STATUS

   讓畫面仍可手動點選
---------------------------------------------------------- */

function tempKey(personId,item,month){

  return [
    "pgy_temp",
    personId,
    item,
    month
  ].join("|");

}


function tempDone(personId,item,month){

  const key =
    tempKey(
      personId,
      item,
      month
    );

  const temp =
    sessionStorage.getItem(key);

  if(temp === "1"){
    return true;
  }

  if(temp === "0"){
    return false;
  }

  return isDone(
    personId,
    item,
    month
  );
}


/* ----------------------------------------------------------
   TOGGLE
---------------------------------------------------------- */

function toggle(personId,item,month){

  const next =
    !tempDone(
      personId,
      item,
      month
    );

  sessionStorage.setItem(
    tempKey(
      personId,
      item,
      month
    ),
    next ? "1" : "0"
  );

  render();

}


/* ----------------------------------------------------------
   SUMMARY
---------------------------------------------------------- */

function summary(person){

  let total = 0;
  let completed = 0;

  tasks.forEach(task => {

    for(let month=1;month<=24;month++){

      if(
        planned(
          task[2],
          month
        )
      ){

        total++;

        if(
          tempDone(
            person.id,
            task[1],
            month
          )
        ){
          completed++;
        }

      }

    }

  });

  return {

    total,
    completed,

    rate:
      total
        ? Math.round(
            completed / total * 100
          )
        : 0,

    month:
      pgyMonth(person)

  };

}


/* ----------------------------------------------------------
   BADGE
---------------------------------------------------------- */

function badge(summary){

  if(summary.rate >= 90){

    return `
      <span class="badge g">
        🟢 正常
      </span>
    `;

  }

  if(summary.rate >= 70){

    return `
      <span class="badge y">
        🟡 追蹤
      </span>
    `;

  }

  return `
    <span class="badge o">
      🟠 需處理
    </span>
  `;

}


/* ----------------------------------------------------------
   PERSON SELECT
---------------------------------------------------------- */

function personSelect(){

  return `
    <select
      onchange="selectPerson(this.value)"
    >
      ${
        people.map(p => `
          <option
            value="${p.id}"
            ${p.id === selected ? "selected" : ""}
          >
            ${p.id}｜${p.name}
          </option>
        `).join("")
      }
    </select>
  `;

}


/* ----------------------------------------------------------
   OVERVIEW
---------------------------------------------------------- */

function overview(){

  if(!people.length){

    return `
      <div class="card empty">
        尚無 PGY 資料。
      </div>
    `;

  }

  const rows =
    people.map(p => {

      const s =
        summary(p);

      const phase =
        s.month <= 3
          ? "Training Course"
          : s.month <= 12
          ? "PGY Core"
          : "Advanced PGY";

      return `
        <tr>

          <td>
            <b>${p.id}</b>　${p.name}
          </td>

          <td>
            M${String(s.month).padStart(2,"0")}
          </td>

          <td>
            ${phase}
          </td>

          <td>

            <div
              style="
                display:flex;
                gap:8px;
                align-items:center
              "
            >

              <div
                class="bar"
                style="width:100px"
              >
                <span
                  style="width:${s.rate}%"
                ></span>
              </div>

              ${s.rate}%

            </div>

          </td>

          <td>
            ${badge(s)}
          </td>

          <td>

            <button
              class="btn"
              onclick="selectPerson('${p.id}')"
            >
              查看
            </button>

          </td>

        </tr>
      `;

    }).join("");


  let total = 0;
  let completed = 0;

  people.forEach(p => {

    const s =
      summary(p);

    total += s.total;
    completed += s.completed;

  });


  const rate =
    total
      ? Math.round(
          completed / total * 100
        )
      : 0;


  return `

    <div class="top">

      <div>

        <h1>
          PGY Mentor Alert
        </h1>

        <div class="sub">
          計畫主任總覽｜24個月 Learning Journey
        </div>

      </div>

    </div>


    <div class="grid">

      <div class="card">
        <div class="label">
          PGY人數
        </div>

        <div class="kpi">
          ${people.length}
        </div>
      </div>


      <div class="card">
        <div class="label">
          整體完成率
        </div>

        <div class="kpi">
          ${rate}%
        </div>
      </div>


      <div class="card">
        <div class="label">
          目前月份範圍
        </div>

        <div class="kpi">
          M01–M24
        </div>
      </div>


      <div class="card">
        <div class="label">
          資料模式
        </div>

        <div
          class="kpi"
          style="font-size:18px"
        >
          GitHub CSV
        </div>
      </div>

    </div>


    <div class="tablewrap">

      <table>

        <thead>

          <tr>
            <th>PGY</th>
            <th>目前Month</th>
            <th>階段</th>
            <th>完成率</th>
            <th>狀態</th>
            <th></th>
          </tr>

        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

  `;

}


/* ----------------------------------------------------------
   MENTOR ALERT
---------------------------------------------------------- */

function mentor(){

  const p = person();

  if(!p){

    return `
      <div class="card empty">
        尚無學員資料。
      </div>
    `;

  }


  const s =
    summary(p);

  const month =
    s.month;


  const list =
    tasks
      .filter(
        task =>
          planned(
            task[2],
            month
          )
      )
      .map(task => {

        const done =
          tempDone(
            p.id,
            task[1],
            month
          );

        return `

          <div class="task">

            <div>

              <b>
                ${task[1]}
              </b>

              <small>
                ${task[0]}
                ｜M${String(month).padStart(2,"0")}
                ｜${md(monthDate(p.start,month))}
              </small>

            </div>


            <button
              class="btn"
              onclick="
                toggle(
                  '${p.id}',
                  '${task[1]}',
                  ${month}
                )
              "
            >
              ${done ? "☑ 已完成" : "☐ 完成"}
            </button>

          </div>

        `;

      }).join("");


  const alerts =
    csvAlerts.filter(row => {

      return value(
        row,
        "Trainee_ID",
        "PGY_ID",
        "ID"
      ) === p.id;

    });


  const alertHtml =
    alerts.length
      ? `

        <div class="notice">

          <b>
            Mentor Alert
          </b>

          <br>

          ${
            alerts.map(row => {

              const message =
                value(
                  row,
                  "Message",
                  "訊息",
                  "Alert",
                  "提醒"
                );

              const priority =
                value(
                  row,
                  "Priority",
                  "優先級",
                  "Level"
                );

              return `
                ${message}
                ${priority
                  ? `　[${priority}]`
                  : ""
                }
              `;

            }).join("<br>")
          }

        </div>

      `
      : "";


  return `

    <div class="top">

      <div>

        <h1>
          Mentor Alert
        </h1>

        <div class="sub">
          導師本期工作清單
        </div>

      </div>

      ${personSelect()}

    </div>


    <div class="notice">

      <b>
        ${p.id}｜${p.name}
      </b>

     　到職 ${p.start}

     　→　目前

      <b>
        M${String(month).padStart(2,"0")}
      </b>

    </div>


    ${alertHtml}


    <div class="card">

      <h2>
        🔔 本期應完成
      </h2>

      ${
        list ||
        "<p>目前沒有對應任務。</p>"
      }

    </div>

  `;

}


/* ----------------------------------------------------------
   LEARNING JOURNEY
---------------------------------------------------------- */

function journey(){

  const p = person();

  if(!p){

    return `
      <div class="card empty">
        尚無學員資料。
      </div>
    `;

  }


  const currentMonth =
    pgyMonth(p);


  const rows =
    tasks.map(task => {

      let plannedCount = 0;
      let doneCount = 0;


      let html = `

        <div class="jr">

          <div>
            <b>
              ${task[1]}
            </b>
          </div>

          <div>
            ${task[0]}
          </div>

          <div>
            ${
              task[2]
                .replace(
                  "recurring-2-3",
                  "每2–3月"
                )
            }
          </div>

      `;


      for(
        let month=1;
        month<=24;
        month++
      ){

        const isPlanned =
          planned(
            task[2],
            month
          );

        let done = false;


        if(isPlanned){

          plannedCount++;

          done =
            tempDone(
              p.id,
              task[1],
              month
            );

          if(done){
            doneCount++;
          }

        }


        html += `

          <div
            class="
              mc
              ${isPlanned ? "planned" : ""}
              ${done ? "done" : ""}
              ${month === currentMonth ? "today" : ""}
            "

            ${
              isPlanned
                ? `
                  onclick="
                    toggle(
                      '${p.id}',
                      '${task[1]}',
                      ${month}
                    )
                  "
                `
                : ""
            }
          >

            ${
              done
                ? "☑"
                : isPlanned
                ? "☐"
                : ""
            }

          </div>

        `;

      }


      const rate =
        plannedCount
          ? Math.round(
              doneCount /
              plannedCount *
              100
            )
          : 0;


      html += `

        <div>
          <b>
            ${rate}%
          </b>
        </div>

      </div>
      `;


      return html;

    }).join("");


  const heads = `

    <div class="jh">

      <div>
        學習／評核項目
      </div>

      <div>
        類別
      </div>

      <div>
        計畫時間
      </div>

      ${
        Array.from(
          {length:24},
          (_,index) => `
            <div>
              M${String(index+1).padStart(2,"0")}
            </div>
          `
        ).join("")
      }

      <div>
        完成率
      </div>

    </div>

  `;


  return `

    <div class="top">

      <div>

        <h1>
          Learning Journey
        </h1>

        <div class="sub">
          24M 工程進度表｜紅框＝目前PGY月份
        </div>

      </div>

      ${personSelect()}

    </div>


    <div class="notice">

      <b>
        ${p.id}｜${p.name}
      </b>

     　到職日 ${p.start}

     　｜目前

      <b>
        M${String(currentMonth).padStart(2,"0")}
      </b>

    </div>


    <div class="journey">

      ${heads}

      ${rows}

    </div>

  `;

}

/* ----------------------------------------------------------
   SELECT PERSON
---------------------------------------------------------- */

function selectPerson(id){

  selected = id;

  if(view === "overview"){
    view = "individual";
  }

  render();

}


/* ----------------------------------------------------------
   RENDER
---------------------------------------------------------- */

function render(){

  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.view === view
      );

    });


  const app =
    document.getElementById("app");


  if(view === "overview"){

    app.innerHTML =
      overview();

  }else if(view === "mentor"){

    app.innerHTML =
      mentor();

  }else if(view === "journey"){

    app.innerHTML =
      journey();

  }else{

    app.innerHTML =
      individual();

  }

}


/* ----------------------------------------------------------
   NAVIGATION
---------------------------------------------------------- */

document
  .querySelectorAll(".nav button")
  .forEach(button => {

    button.onclick = () => {

      view =
        button.dataset.view;

      render();

    };

  });


/* ----------------------------------------------------------
   BOOT CSV
---------------------------------------------------------- */

async function bootCSV(){

  try{

    const [
      pgy,
      journeyData,
      assessment,
      alerts
    ] = await Promise.all([

      loadCSV(
        "pgy_master.csv"
      ),

      loadCSV(
        "learning_journey.csv"
      ),

      loadCSV(
        "assessment.csv"
      ),

      loadCSV(
        "mentor_alert.csv"
      )

    ]);


    /* PGY MASTER */

    people =
      pgy
        .map(row => {

          return {

            id:
              value(
                row,
                "Trainee_ID",
                "PGY_ID",
                "ID"
              ),

            name:
              value(
                row,
                "Name",
                "姓名"
              ),

            start:
              value(
                row,
                "Start_Date",
                "到職日",
                "Start"
              ),

            end:
              value(
                row,
                "Training_End_Date",
                "訓練結束日",
                "End_Date"
              ),

            role:
              value(
                row,
                "PGY_Role",
                "Role"
              ) || "PGY",

            status:
              value(
                row,
                "Status",
                "狀態"
              ) || "在訓",

            csvMonth:
              value(
                row,
                "PGY_Month",
                "目前PGY Month",
                "Month"
              )

          };

        })
        .filter(
          person =>
            person.id !== ""
        );


    csvJourney =
      journeyData || [];


    csvAssessment =
      assessment || [];


    csvAlerts =
      alerts || [];


    /* DEFAULT SELECTED PGY */

    if(
      !selected ||
      !people.some(
        p => p.id === selected
      )
    ){

      selected =
        people.length
          ? people[0].id
          : "";

    }


    render();


    console.log(
      "PGY Mentor Alert CSV loaded",
      {
        people:people.length,
        journey:csvJourney.length,
        assessment:csvAssessment.length,
        alerts:csvAlerts.length
      }
    );


  }catch(error){

    console.error(
      "GitHub CSV loading failed:",
      error
    );


    /*
      重要：
      CSV讀取失敗時
      不讓整個畫面消失。
    */

    render();

  }

}


/* ----------------------------------------------------------
   INITIAL RENDER
---------------------------------------------------------- */

render();

bootCSV();

</script>
