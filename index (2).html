<script>

let people=[];
let csvJourney=[];
let csvAssessment=[];
let csvAlerts=[];

let selected="";
let view="overview";


/* =========================================================
   PGY 任務設定
========================================================= */

const tasks=[

["基礎課程","基本氧氣治療與溼氣噴霧治療","1-3"],

["基礎課程","低血氧／高二氧化碳／ABG","1-3"],

["基礎課程","Auto-PEEP及處置","1-3"],

["基礎課程","身體評估","1-3"],

["基礎課程","呼吸照護登入系統（VPN）","1-3"],

["技術評核","0–3個月技術考","1-3"],

["專業課程","臨床成人呼吸生理學","4-12"],

["專業課程","胸腔常見疾病介紹","4-12"],

["專業課程","小兒氣道照護","4-12"],

["專業課程","呼吸器分類／操作／脫離（含ATC）","4-12"],

["專業課程","健保相關事宜","4-12"],

["技術評核","4–12個月技術評核","4-12"],

["專業課程","手術前後呼吸照護","13-24"],

["專業課程","COPD呼吸照護","13-24"],

["專業課程","ARDS呼吸照護","13-24"],

["專業課程","VAP呼吸照護","13-24"],

["專業課程","呼吸功能改善","13-24"],

["專業課程","HFOV臨床應用","13-24"],

["專業課程","iNO臨床應用","13-24"],

["專業課程","Prone Position Ventilation","13-24"],

["專業課程","Lung Recruitment Management","13-24"],

["技術評核","13–24個月技術評核","13-24"],

["EPA","Ad-hoc EPA","recurring-2-3"],

["評核","Mini-CEX","quarter"],

["評核","CBD／PBD","quarter"],

["評核","IPD／360°","quarter"],

["CCC","CCC能力進度檢視","ccc"],

["導師","每月導師面談","monthly"],

["Exit","結訓前能力盤點","22-24"],

["Exit","Final Assessment／結訓確認","24-24"]

];


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

  const rows=[];
  let row=[];
  let field="";
  let quoted=false;

  for(let i=0;i<text.length;i++){

    const ch=text[i];
    const nx=text[i+1];

    if(quoted){

      if(ch=='"' && nx=='"'){
        field+='"';
        i++;
      }

      else if(ch=='"'){
        quoted=false;
      }

      else{
        field+=ch;
      }

    }

    else{

      if(ch=='"'){
        quoted=true;
      }

      else if(ch==','){
        row.push(field);
        field="";
      }

      else if(ch=='\n'){
        row.push(field);
        rows.push(row);
        row=[];
        field="";
      }

      else if(ch!='\r'){
        field+=ch;
      }

    }
  }

  if(field!=="" || row.length){
    row.push(field);
    rows.push(row);
  }

  const h=(rows.shift()||[]).map(x=>x.trim());

  return rows
    .filter(r=>r.some(x=>x!==""))
    .map(r=>{
      const o={};
      h.forEach((k,i)=>{
        o[k]=(r[i]??"").trim();
      });
      return o;
    });
}


async function loadCSV(file){

  const r=await fetch(
    "./data/"+file+"?v="+Date.now(),
    {
      cache:"no-store"
    }
  );

  if(!r.ok){
    throw new Error(file+" HTTP "+r.status);
  }

  return parseCSV(await r.text());
}


/* =========================================================
   日期 / PGY Month
========================================================= */

function date(s){
  return new Date(
    String(s).slice(0,10)+"T00:00:00"
  );
}


function pgyMonth(s){

  if(!s)return 0;

  const a=date(s);
  const b=new Date();

  return Math.max(
    1,
    Math.min(
      24,
      (b.getFullYear()-a.getFullYear())*12
      +b.getMonth()-a.getMonth()
      +1
    )
  );
}


function monthDate(s,m){

  let x=date(s);

  x.setMonth(
    x.getMonth()+m-1
  );

  return x;
}


function md(x){

  return x.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  );
}


/* =========================================================
   任務計畫
========================================================= */

function planned(t,m){

  if(t==="monthly"){
    return true;
  }

  if(t==="quarter"){
    return m%3===0;
  }

  if(t==="ccc"){
    return [3,6,12,18,24].includes(m);
  }

  if(t==="recurring-2-3"){
    return [3,6,9,12,15,18,21,24].includes(m);
  }

  if(t.includes("-")){

    let[a,b]=t
      .split("-")
      .map(Number);

    return m>=a && m<=b;
  }

  return false;
}


/* =========================================================
   CSV Status
========================================================= */

function csvStatus(v){

  return [
    "☑",
    "✓",
    "✔",
    "完成",
    "Done",
    "done",
    "TRUE",
    "True",
    "1",
    "yes",
    "Yes"
  ].includes(
    String(v).trim()
  );
}


function isDone(p,t,m){

  const r=csvJourney.find(
    x=>
      x.Trainee_ID===p &&
      x.Item===t &&
      String(parseInt(x.Month,10))===String(m)
  );

  return !!(
    r &&
    csvStatus(r.Status)
  );
}


function tempDone(p,t,m){

  const k=
    p+"|"+t+"|"+m;

  const z=
    sessionStorage.getItem(
      "pgy_temp_v2_"+k
    );

  return z==="1"
    ||
    (
      z===null &&
      isDone(p,t,m)
    );
}


function toggle(p,t,m){

  const k=
    p+"|"+t+"|"+m;

  const next=
    !tempDone(p,t,m);

  sessionStorage.setItem(
    "pgy_temp_v2_"+k,
    next?"1":"0"
  );

  render();
}


/* =========================================================
   Person
========================================================= */

function person(){

  return people.find(
    p=>p.id===selected
  ) || people[0];
}


/* =========================================================
   Summary
========================================================= */

function summary(p){

  const m=pgyMonth(p.start);

  let n=0;
  let c=0;

  tasks.forEach(t=>{

    for(
      let mm=1;
      mm<=m;
      mm++
    ){

      if(planned(t[2],mm)){

        n++;

        if(
          tempDone(
            p.id,
            t[1],
            mm
          )
        ){
          c++;
        }

      }

    }

  });

  return{
    n,
    c,
    rate:n
      ?Math.round(c/n*100)
      :0,
    m
  };
}


function badge(s){

  return s.rate>=90

    ?'<span class="badge g">🟢 正常</span>'

    :s.rate>=70

    ?'<span class="badge y">🟡 追蹤</span>'

    :'<span class="badge o">🟠 需處理</span>';
}


/* =========================================================
   PGY Select
========================================================= */

function sel(className=""){

  return `
  <select
    class="${className}"
    onchange="selectPerson(this.value)"
  >
    ${
      people.map(p=>
        `
        <option
          value="${p.id}"
          ${p.id===selected?"selected":""}
        >
          ${p.id}｜${p.name}
        </option>
        `
      ).join("")
    }
  </select>
  `;
}


/* =========================================================
   Page 1
========================================================= */

function overview(){

  /* =======================================================
     STEP 1｜首頁改為 Mentor Alert
     24M Learning Journey 保留在 Page 3 / 個人 PGY
  ======================================================= */

  const categories=[
    "專業課程",
    "技術考評",
    "EPA",
    "Mini-CEX",
    "CbD",
    "IPD",
    "導師訪談",
    "CCC"
  ];

  function categoryOf(t){

    const c=t[0];
    const n=t[1];

    if(c==="EPA"){
      return "EPA";
    }

    if(c==="CCC"){
      return "CCC";
    }

    if(c==="導師"){
      return "導師訪談";
    }

    if(c==="技術評核"){
      return "技術考評";
    }

    if(c==="評核" && /Mini-CEX/i.test(n)){
      return "Mini-CEX";
    }

    if(c==="評核" && /CBD|PBD/i.test(n)){
      return "CbD";
    }

    if(c==="評核" && /IPD|360/i.test(n)){
      return "IPD";
    }

    if(c==="專業課程"){
      return "專業課程";
    }

    return null;
  }


  function categorySummary(category){

    let plannedCount=0;
    let doneCount=0;

    people.forEach(p=>{

      const m=pgyMonth(p.start);

      tasks.forEach(t=>{

        if(categoryOf(t)!==category){
          return;
        }

        for(let mm=1;mm<=m;mm++){

          if(planned(t[2],mm)){

            plannedCount++;

            if(tempDone(p.id,t[1],mm)){
              doneCount++;
            }

          }

        }

      });

    });

    return{
      planned:plannedCount,
      done:doneCount,
      rate:plannedCount
        ?Math.round(doneCount/plannedCount*100)
        :0
    };

  }


  const categoryCards=
    categories.map(category=>{

      const s=categorySummary(category);

      return `
      <div class="category-card">

        <div class="category-head">

          <span>
            ${category}
          </span>

          <span class="category-rate">
            ${s.rate}%
          </span>

        </div>

        <div class="category-bar">
          <span style="width:${s.rate}%"></span>
        </div>

        <div
          style="
          margin-top:7px;
          font-size:12px;
          color:#667085
          "
        >
          已完成 ${s.done}／應完成 ${s.planned}
        </div>

      </div>
      `;

    }).join("");


  /* =======================================================
     本月 Alert Action Center
     顯示所有在訓 PGY 的目前月份任務
  ======================================================= */

  const actionRows=[];

  people.forEach(p=>{

    if(p.status && p.status!=="在訓"){
      return;
    }

    const m=pgyMonth(p.start);

    tasks.forEach(t=>{

      if(!planned(t[2],m)){
        return;
      }

      const category=categoryOf(t);

      if(!category){
        return;
      }

      const done=tempDone(
        p.id,
        t[1],
        m
      );

      actionRows.push({

        id:p.id,
        name:p.name,
        month:m,
        category,
        item:t[1],
        done

      });

    });

  });


  actionRows.sort((a,b)=>{

    if(a.done!==b.done){
      return a.done ? 1 : -1;
    }

    return a.id.localeCompare(b.id);

  });


  const actionHtml=
    actionRows.length

    ?actionRows.map(x=>`

      <div class="alert-item">

        <div class="alert-person">
          ${x.id}
        </div>

        <div class="alert-task">

          ${x.item}

          <small>
            ${x.name}
            ｜${x.category}
            ｜M${String(x.month).padStart(2,"0")}
          </small>

        </div>

        <div>
          <span

            }

        </div>

        <div
          style="

          color:#667085;
          text-align:center

    :`
      <div class="empty-alert">
        🎉 目前沒有本月待處理項目。
      </div>
    `;


  /* =======================================================
     KPI
  ======================================================= */

  const total=
    people.reduce(
      (a,p)=>a+summary(p).n,
      0
    );

  const done=
    people.reduce(
      (a,p)=>a+summary(p).c,
      0

  const todo=
    Math.max(

  return `

  <div class="top">

        PGY Mentor Alert

      </div>

      </div>

    </div>


    <div class="alert-summary-card">

      <div class="label">

      </div>

      <div class="alert-number">
        ${todo}
      </div>

    </div>


    <div class="alert-summary-card">

  <div class="card action-card">

function isLearningTaskPlanned(plan,m){
  if(String(plan).startsWith("months:")){
    const months=String(plan).slice(7).split(",").map(Number);
    return months.includes(m);
  }
  return planned(plan,m);
}



/* 新清單名稱若與既有 CSV 項目略有差異，沿用原始完成紀錄。 */
function learningTaskSourceItem(item){
  const aliases={
    "HFOV呼吸照護":"HFOV臨床應用",
    "iNO呼吸照護":"iNO臨床應用",
    "Prone Position 通氣照護":"Prone Position Ventilation"
  };
  return aliases[item] || item;
}


function learningTaskDone(p,item,m){
  const key=p+"|"+item+"|"+m;
  const override=sessionStorage.getItem("pgy_temp_v2_"+key);
  if(override!==null){
    return override==="1";
  }

  const sourceItem=learningTaskSourceItem(item);
  const r=csvJourney.find(
    x=>x.Trainee_ID===p &&
       x.Item===sourceItem &&
       String(parseInt(x.Month,10))===String(m)
  );
  return !!(r && csvStatus(r.Status));
}


function toggleLearningTask(p,item,m){
  const next=!learningTaskDone(p,item,m);
  const key=p+"|"+item+"|"+m;
  sessionStorage.setItem("pgy_temp_v2_"+key,next?"1":"0");
  render();
}

function journey(){

  const p=person();

  if(!p){
    return `<div class="card">尚無學員資料。</div>`;
  }

  const m=pgyMonth(p.start);

  const rows=learningTasks.map(t=>{

    let c=`
      <div class="jr">
        <div class="table-item-name"><b>${t[1]}</b></div>
        <div>${t[0]}</div>
        <div>${t[3] || t[2]}</div>
    `;

    for(let mm=1;mm<=24;mm++){

      // 保留 CSV 既有完成紀錄；新增清單項目依所屬階段列入計畫月份。
      const sourceItem=learningTaskSourceItem(t[1]);
      const r=csvJourney.find(
        x=>x.Trainee_ID===p.id &&
           x.Item===sourceItem &&
           String(parseInt(x.Month,10))===String(mm)
      );

      const isPlanned=!!r || isLearningTaskPlanned(t[2],mm);
      const isDone=isPlanned ? learningTaskDone(p.id,t[1],mm) : false;
      const cls=`mc ${isPlanned?"planned":""} ${isDone?"done":""} ${mm===m?"today":""}`;
      const mark=isDone ? "✓" : isPlanned ? "☐" : "";

      c+=`
        <div class="${cls}"
          ${isPlanned ? `onclick="toggleLearningTask('${p.id}','${t[1].replace(/'/g,"&#39;")}',${mm})"` : ""}>
          ${mark}
        </div>
      `;
    }

    // 完成率是項目完成進度，不是評分；不提供等級或分數輸入。
    const plannedCount=Array.from({length:24},(_,i)=>i+1)
      .filter(mm=>isLearningTaskPlanned(t[2],mm)).length;
    const doneCount=Array.from({length:24},(_,i)=>i+1)
      .filter(mm=>isLearningTaskPlanned(t[2],mm) && learningTaskDone(p.id,t[1],mm)).length;

    c+=`<div><b>${plannedCount ? Math.round(doneCount/plannedCount*100) : 0}%</b></div></div>`;
    return c;
  }).join("");

  const heads=`
    <div class="jh">
      <div>學習／評核項目</div>
      <div>類別</div>
      <div>計畫時間</div>
      ${Array.from({length:24},(_,i)=>`<div>M${String(i+1).padStart(2,"0")}</div>`).join("")}
      <div>完成率</div>
    </div>
  `;

  return `
    <div class="learning-journey-page">
      <div class="top">
        <div>
          <h1>Learning Journey</h1>
          <div class="sub">24M 工程進度表｜紅框＝目前 PGY 月份</div>
        </div>

        <div class="journey-person-tools">
          ${sel("journey-select")}

          </div>
        </div>
      </div>

      <div class="journey">
        ${heads}
        ${rows}
      </div>
    </div>
  `;
}

/* =========================================================
   新增 PGY → Power Automate
========================================================= */

async function submitPGY(){

  const id=
    document
    .getElementById("v2_id")
    .value
    .trim();


  const name=
    document
    .getElementById("v2_name")
    .value
    .trim();


  const start=
    document
    .getElementById("v2_start")
    .value;


  const end=
    document
    .getElementById("v2_end")
    .value;


  const mentor=
    document
    .getElementById("v2_mentor")
    .value
    .trim();


  const status=
    document
    .getElementById("v2_pgy")
    .value;


  const url=
    document
    .getElementById("v2_url")
    .value
    .trim();


  const result=
    document
    .getElementById(
      "pgy_submit_result"
    );


  /* ===== 基本檢查 ===== */

  if(!id){

    result.innerHTML=`
      <div class="fail-box">
        ⚠️ 請輸入 Trainee ID。
      </div>
    `;

    return;
  }


  if(!name){

    result.innerHTML=`
      <div class="fail-box">
        ⚠️ 請輸入學員姓名。
      </div>
    `;

    return;
  }


  if(!start){

    result.innerHTML=`
      <div class="fail-box">
        ⚠️ 請輸入到職日。
      </div>
    `;

    return;
  }


  if(!url){

    result.innerHTML=`
      <div class="fail-box">
        ⚠️ 請輸入 Power Automate HTTP URL。
      </div>
    `;

    return;
  }


  /* ===== 保存 URL ===== */

  localStorage.setItem(
    "PGY_POWER_AUTOMATE_URL",
    url
  );


  /* ===== Payload ===== */

  const payload={

    Title:id,

    學員姓名:name,

    到職日:start,

    預計結訓日期:end,

    Mentor:mentor,

    PGY狀態:status

  };


  /* ===== UI ===== */

  result.innerHTML=`
    <div class="notice">
      ⏳ 正在送出 PGY 資料……
    </div>
  `;


  try{

    const response=
      await fetch(
        url,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    result.innerHTML=`

      <div class="success-box">

        <b>
          ✅ PGY 新增請求已成功送出
        </b>

        <br><br>

        Trainee ID：
        <b>${id}</b>

        <br>

        學員姓名：
        <b>${name}</b>

        <br>

        Power Automate
        已收到資料。

        <br><br>

        請由 Power Automate
        繼續寫入 SharePoint。

      </div>

    `;


    /* 保留 URL，但清空個人資料 */

    document
      .getElementById("v2_id")
      .value="";

    document
      .getElementById("v2_name")
      .value="";

    document
      .getElementById("v2_start")
      .value="";

    document
      .getElementById("v2_end")
      .value="";

    document
      .getElementById("v2_mentor")
      .value="";

    document
      .getElementById("v2_pgy")
      .value="在訓";


  }catch(error){

    console.error(
      "Power Automate error:",
      error
    );


    result.innerHTML=`

      <div class="fail-box">

        <b>
          ❌ PGY 新增失敗
        </b>

        <br><br>

        ${error.message}

        <br><br>

        請確認：

        <br>

        1. Power Automate HTTP URL 是否正確

        <br>

        2. Power Automate Flow 是否正在使用

        <br>

        3. HTTP Trigger 是否設定正確

        <br>

        4. Power Automate 是否已成功連線 SharePoint

      </div>

    `;

  }

}

  }

/* =========================================================
   Page Navigation
========================================================= */

function selectPerson(id){

  selected=id;

  if(view==="overview"){
    view="individual";
  }

  render();
}


function render(){

  document
    .querySelectorAll(".nav button")
    .forEach(b=>{

      b.classList.toggle(
        "active",
        b.dataset.view===view
      );

    });


  const app=
    document.getElementById(
      "app"
    );


  if(view==="overview"){

    app.innerHTML=
      overview();

  }

  else if(view==="mentor"){

    app.innerHTML=
      mentor();

  }

  else if(view==="journey"){

    app.innerHTML=
      journey();

  }

  else if(view==="individual"){

    app.innerHTML=
      individual();

  }

  else if(view==="addpgy"){

    app.innerHTML=
      addPGY();

  }

}


/* =========================================================
   Navigation Event
========================================================= */

document
  .querySelectorAll(".nav button")
  .forEach(b=>{

    b.onclick=()=>{

      view=
        b.dataset.view;

      render();

    };

  });


/* =========================================================
   CSV Boot
========================================================= */

async function bootCSV(){

  try{

    people=
      (
        await loadCSV(
          "pgy_master.csv"
        )
      )
      .map(x=>({

        id:x.Trainee_ID,

        name:x.Name,

        start:x.Start_Date,

        end:x.End_Date||"",

        role:x.Role||"PGY",

        status:x.Status||"在訓"

      }));


    csvJourney=
      await loadCSV(
        "learning_journey.csv"
      );


    csvAssessment=
      await loadCSV(
        "assessment.csv"
      );


    csvAlerts=
      await loadCSV(
        "mentor_alert.csv"
      );


    selected=
      selected &&
      people.some(
        p=>p.id===selected
      )
      ?selected
      :(people[0]?.id||"");


    render();

  }


  catch(e){

    console.error(
      "CSV loading failed:",
      e
    );


    document
      .getElementById("app")
      .innerHTML=`

      <div class="error">

        <b>
          ⚠️ CSV 讀取失敗
        </b>

        <p>
          ${e.message}
        </p>

        <p>

          請確認 GitHub 的
          <b>/data/</b>
          內存在：

          <br><br>

          pgy_master.csv

          <br>

          learning_journey.csv

          <br>

          assessment.csv

          <br>

          mentor_alert.csv

        </p>

      </div>

      `;

  }

}


/* =========================================================
   啟動
========================================================= */

render();

bootCSV();

</script>
